<div class="page auth-page">
  <header class="page-header">
    <div>
      <h2>Admin login</h2>
      <p class="page-subtitle">Prijava za administratore sistema</p>
    </div>
  </header>

  <form class="form-card form-grid auth-form" name="LoginForm">
    <label>
      Korisnicko ime
      <input type="text" name="username" [(ngModel)]="username" placeholder="Korisnicko ime">
    </label>

    <label>
      Lozinka
      <input type="password" name="password" [(ngModel)]="password" placeholder="Lozinka">
    </label>

    <div class="action-row">
      <button type="button" (click)="login()">Uloguj se</button>
    </div>

    @if(message !== "") {
      <p class="error-message">{{message}}</p>
    }
  </form>
</div>
