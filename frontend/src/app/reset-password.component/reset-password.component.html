<section class="page password-page">
  <header class="page-header">
    <div>
      <h2>Postavljanje nove lozinke</h2>
      <p class="page-subtitle">Unesite i potvrdite novu lozinku za nalog.</p>
    </div>
  </header>

  <section class="section-card">
    <form class="password-form">
      <label>
        Nova lozinka
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Nova lozinka"
        >
      </label>

      <label>
        Potvrda lozinke
        <input
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="Ponovite lozinku"
        >
      </label>

      <div class="action-row">
        <button type="button" (click)="resetPassword()">Sacuvaj novu lozinku</button>
      </div>
    </form>
  </section>

  @if(message !== "") {
    <p class="success-message">{{message}}</p>
  }

  @if(error !== "") {
    <p class="error-message">{{error}}</p>
  }
</section>
