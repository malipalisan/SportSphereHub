<section class="page password-page">
  <header class="page-header">
    <div>
      <h2>Zaboravljena lozinka</h2>
      <p class="page-subtitle">Unesite korisnicko ime ili email za generisanje privremenog linka.</p>
    </div>
  </header>

  <section class="section-card">
    <form class="password-form">
      <label>
        Korisnicko ime ili email
        <input
          type="text"
          name="identifier"
          [(ngModel)]="identifier"
          placeholder="Unesite korisnicko ime ili email"
        >
      </label>

      <div class="action-row">
        <button type="button" (click)="requestReset()">Generisi link</button>
      </div>
    </form>
  </section>

  @if(message !== "") {
    <p class="success-message">{{message}}</p>
  }

  @if(error !== "") {
    <p class="error-message">{{error}}</p>
  }

  @if(resetLink !== "") {
    <div class="reset-link-box">
      <p>Link vazi 30 minuta:</p>
      <a [href]="resetLink">{{resetLink}}</a>
    </div>
  }
</section>
