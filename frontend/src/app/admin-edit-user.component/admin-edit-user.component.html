<div class="page admin-edit-page">
  <header class="page-header">
    <div>
      <h2>Izmena korisnika</h2>
      <p class="page-subtitle">Azuriranje osnovnih podataka, uloge i statusa naloga.</p>
    </div>
  </header>

  @if(message !== "") {
    <p class="status-message">{{ message }}</p>
  }

  @if(user._id !== "") {
    <section class="section-card">
      <div class="form-grid">
        <label>
          Korisnicko ime
          <input type="text" [(ngModel)]="user.username">
        </label>

        <label>
          Ime
          <input type="text" [(ngModel)]="user.firstName">
        </label>

        <label>
          Prezime
          <input type="text" [(ngModel)]="user.lastName">
        </label>

        <label>
          Email
          <input type="text" [(ngModel)]="user.email">
        </label>

        <label>
          Telefon
          <input type="text" [(ngModel)]="user.phone">
        </label>

        <label>
          Uloga
          <select [(ngModel)]="user.role">
            <option value="admin">admin</option>
            <option value="athlete">athlete</option>
            <option value="employee">employee</option>
          </select>
        </label>

        <label>
          Status
          <select [(ngModel)]="user.status">
            <option value="pending">pending</option>
            <option value="approved">approved</option>
            <option value="rejected">rejected</option>
            <option value="blocked">blocked</option>
          </select>
        </label>
      </div>

      <div class="action-row">
        <button (click)="save()">Sacuvaj</button>
        <button (click)="cancel()">Odustani</button>
      </div>
    </section>
  }
</div>
